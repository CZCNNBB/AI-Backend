server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端默认上传限制保持一致，避免请求在进入 FastAPI 前被 Nginx 拒绝。
    client_max_body_size 128m;

    # 容器健康检查使用独立端点，不依赖后端状态。
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 前端所有 /api 请求转发给 AI-backend，并移除 /api 前缀。
    location /api/ {
        proxy_pass http://ai-backend:8090/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Agent 使用 SSE 持续返回事件，必须关闭代理缓冲和缓存。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
    }

    # Vue Router 使用前端路由，未知静态路径统一回退 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
